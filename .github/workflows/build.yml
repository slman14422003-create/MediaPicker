name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        type: choice
        options: [release, debug]
        default: release
      version:
        description: 'Version tag (example v1.1), empty = automatic'
        type: string
        default: ''
      publish_release:
        description: 'Publish the APK as a GitHub Release'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch' }}

env:
  BUILD_TYPE: ${{ inputs.build_type || 'release' }}

jobs:
  build:
    name: Build ${{ inputs.build_type || 'release' }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      publish: ${{ steps.meta.outputs.publish }}
      permanent: ${{ steps.sign.outputs.permanent }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: meta
        env:
          IN_VERSION: ${{ inputs.version }}
          IN_PUBLISH: ${{ inputs.publish_release }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          BASE="$(grep -oP 'versionName\s*=\s*System\.getenv\([^)]*\)\s*\?:\s*"\K[^"]+' app/build.gradle | head -n1)"
          [ -z "$BASE" ] && BASE="1.0"
          PUBLISH=false
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"; PUBLISH=true
          elif [ -n "$IN_VERSION" ]; then
            TAG="$IN_VERSION"; [[ "$TAG" != v* ]] && TAG="v$TAG"
          else
            TAG="v${BASE}.${GITHUB_RUN_NUMBER}"
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            PUBLISH="${IN_PUBLISH:-true}"
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            PUBLISH=true
            case "$COMMIT_MSG" in *"[skip release]"*|*"[no release]"*) PUBLISH=false ;; esac
          fi
          if [ "$BUILD_TYPE" != "release" ] || [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then PUBLISH=false; fi
          {
            echo "tag=$TAG"
            echo "publish=$PUBLISH"
          } >> "$GITHUB_OUTPUT"
          echo "APP_VERSION_NAME=${TAG#v}" >> "$GITHUB_ENV"
          echo "VERSION_CODE_OVERRIDE=$((10 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK (API 36)
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      # Permanent signing key from repository secrets. Without them the APK gets a throw-away debug key
      # and is never published as a Release (it could not update the installed app).
      - name: Prepare release signing
        id: sign
        if: env.BUILD_TYPE == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          STORE_PASS="${KEYSTORE_PASSWORD:-${STORE_PASSWORD:-$KEY_PASSWORD}}"
          ALIAS="${KEY_ALIAS:-mediapicker}"
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASS" ]; then
            echo "::warning title=No permanent signing key::Add KEYSTORE_BASE64, KEYSTORE_PASSWORD and KEY_ALIAS as repository secrets. This build uses a temporary debug key."
            echo "SIGNING_MODE=debug key" >> "$GITHUB_ENV"
            echo "permanent=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "::add-mask::$STORE_PASS"
          [ -n "$KEY_PASSWORD" ] && echo "::add-mask::$KEY_PASSWORD"
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$STORE_PASS" -alias "$ALIAS" >/dev/null 2>&1; then
            echo "::error title=Invalid signing key::The keystore could not be opened. Check KEYSTORE_BASE64, the password and the alias ($ALIAS)."
            exit 1
          fi
          {
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks"
            echo "SIGNING_STORE_PASSWORD=$STORE_PASS"
            echo "SIGNING_KEY_ALIAS=$ALIAS"
            echo "SIGNING_KEY_PASSWORD=${KEY_PASSWORD:-$STORE_PASS}"
            echo "SIGNING_MODE=repository key"
          } >> "$GITHUB_ENV"
          echo "permanent=true" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: |
          if [ "$BUILD_TYPE" = "release" ]; then
            gradle assembleRelease --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Collect APK
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          APK_SRC="$(ls app/build/outputs/apk/${BUILD_TYPE}/*.apk | head -n1)"
          mkdir -p dist
          APK="dist/MediaPicker-${TAG}-${BUILD_TYPE}.apk"
          cp "$APK_SRC" "$APK"
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          {
            echo "## Media Picker - $BUILD_TYPE"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Version | \`$TAG\` |"
            echo "| File | \`$(basename "$APK")\` |"
            echo "| Size | $(du -h "$APK" | cut -f1) |"
            echo "| Signing | ${SIGNING_MODE:-debug key} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: MediaPicker-${{ env.BUILD_TYPE }}-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload R8 mapping
        if: ${{ env.BUILD_TYPE == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: MediaPicker-r8-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Refuse to publish with a temporary key
        if: ${{ steps.meta.outputs.publish == 'true' && steps.sign.outputs.permanent != 'true' }}
        run: |
          echo "::error title=Release not published::The permanent signing secrets are missing. The APK is available under Artifacts for testing only."
          exit 1

  release:
    name: Publish GitHub Release
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build.outputs.publish == 'true' && needs.build.outputs.permanent == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MediaPicker-release-apk
          path: dist

      - name: Create or update release
        run: |
          APK="$(ls dist/*.apk | head -n1)"
          SHA="$(sha256sum "$APK" | cut -d' ' -f1)"
          printf 'SHA-256: %s\n' "$SHA" > notes.md
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --generate-notes --notes-file notes.md
          fi
