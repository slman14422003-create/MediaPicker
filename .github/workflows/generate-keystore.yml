name: Generate signing key

# Run once to create the permanent signing key, then add the values as repository secrets.
# Download the "signing-key" artifact right away and delete it from the run page afterwards.
on:
  workflow_dispatch:
    inputs:
      alias:
        description: 'Key alias'
        type: string
        default: 'mediapicker'
      common_name:
        description: 'Certificate name (CN)'
        type: string
        default: 'Media Picker'

permissions:
  contents: read

jobs:
  keygen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create the keystore
        env:
          ALIAS: ${{ inputs.alias }}
          CN: ${{ inputs.common_name }}
        run: |
          set -e
          mkdir -p out
          PASS="$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 24)"
          echo "::add-mask::$PASS"
          keytool -genkeypair -keystore out/release.jks -storetype PKCS12 \
            -alias "$ALIAS" -keyalg RSA -keysize 4096 -validity 10950 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=$CN"
          base64 -w0 out/release.jks > out/KEYSTORE_BASE64.txt
          {
            echo "KEYSTORE_BASE64=$(cat out/KEYSTORE_BASE64.txt)"
            echo "KEYSTORE_PASSWORD=$PASS"
            echo "KEY_ALIAS=$ALIAS"
            echo "KEY_PASSWORD=$PASS"
          } > out/signing-info.txt

      - uses: actions/upload-artifact@v4
        with:
          name: signing-key
          path: out/
          retention-days: 1
